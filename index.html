<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI English Daily</title>
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #f8f6f1;
			color: #2d2a24;
			min-height: 100vh;
		}

		.site-header {
			background: #2d2a24;
			color: #f8f6f1;
			padding: 20px 24px;
		}
		.site-header h1 {
			font-size: 22px;
			font-weight: 700;
			letter-spacing: -0.02em;
		}
		.site-header p {
			font-size: 13px;
			color: #c9b99a;
			margin-top: 4px;
		}

		.container {
			max-width: 680px;
			margin: 40px auto;
			padding: 0 24px;
		}

		.section-label {
			font-size: 12px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: #8a7e6e;
			margin-bottom: 16px;
		}

		ul#article-list {
			list-style: none;
		}

		ul#article-list li {
			border-bottom: 1px solid #e8e0d4;
		}

		ul#article-list a {
			display: flex;
			align-items: baseline;
			gap: 10px;
			padding: 16px 0;
			text-decoration: none;
			color: #2d2a24;
			transition: color 0.1s;
		}

		ul#article-list a:hover {
			color: #9a4e00;
		}

		.source-tag {
			font-size: 11px;
			background: #e8e0d4;
			color: #6b5f50;
			border-radius: 4px;
			padding: 2px 7px;
			white-space: nowrap;
			font-weight: 500;
			margin-left: auto;
		}

		.empty-state {
			color: #8a7e6e;
			font-size: 15px;
			padding: 32px 0;
		}
	</style>
</head>
<body>

<header class="site-header">
	<h1>AI English Daily</h1>
	<p>每日一篇 AI 領域英文文章，雙語對照 + 互動詞彙學習</p>
</header>

<div class="container">
	<div class="section-label">文章列表</div>
	<ul id="article-list">
		<li class="empty-state">尚無文章，明天見。</li>
	</ul>
</div>

</body>
</html>
